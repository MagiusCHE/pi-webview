<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="microphonePermissionTitle"></title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-width: 22rem;
        background: Canvas;
        color: CanvasText;
      }

      main {
        display: grid;
        gap: 1rem;
        padding: 1.5rem;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 1.125rem;
      }

      p {
        color: color-mix(in srgb, CanvasText 75%, Canvas 25%);
        line-height: 1.45;
      }

      #status:empty {
        display: none;
      }

      #status[data-state="error"] {
        color: #b3261e;
      }

      #status[data-state="success"] {
        color: #227a46;
      }

      footer {
        display: flex;
        justify-content: end;
        gap: 0.5rem;
      }

      button {
        min-height: 2.25rem;
        padding: 0.375rem 0.75rem;
        border: 1px solid color-mix(in srgb, CanvasText 35%, Canvas 65%);
        border-radius: 0.375rem;
        background: Canvas;
        color: CanvasText;
        font: inherit;
      }

      #allow {
        border-color: #cc7d5e;
        background: #cc7d5e;
        color: white;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="microphonePermissionTitle"></h1>
      <p data-i18n="microphonePermissionDescription"></p>
      <p id="status" aria-live="polite"></p>
      <footer>
        <button id="cancel" type="button" data-i18n="microphonePermissionCancel"></button>
        <button id="allow" type="button" data-i18n="microphonePermissionAllow"></button>
      </footer>
    </main>
    <script src="microphone-permission.js"></script>
  </body>
</html>
