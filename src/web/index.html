<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pi-webview</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- boot loader: covers the UI until there is data -->
    <div id="boot-loader" class="boot-loader">
      <div class="boot-loader-content">
        <span class="spinner"></span>
        <span id="boot-loader-text">Caricamento…</span>
      </div>
    </div>

    <header>
      <div class="session-wrap">
        <span id="conn-dot" class="conn-dot conn-connecting" title="connessione…"></span>
        <div id="session-dropdown" class="dropdown">
          <button id="session-btn" class="session-btn" title="Sessioni">—</button>
          <div id="session-menu" class="dropdown-menu" hidden>
            <div id="session-filters" class="session-filters"></div>
            <div id="session-items" class="session-items"></div>
          </div>
        </div>
      </div>
      <span class="spacer"></span>
      <button
        id="btn-new-chat"
        class="icon-btn"
        title="Nuova chat in un altro pannello"
      ></button>
      <button
        id="btn-settings"
        class="icon-btn"
        title="Impostazioni"
        aria-expanded="false"
      >
        ⚙
      </button>
    </header>

    <!-- settings modal dialog -->
    <div id="settings-modal" class="modal-backdrop" hidden>
      <div class="modal">
        <div class="modal-head">
          <span id="settings-modal-title" class="modal-title">Impostazioni</span>
          <button id="btn-settings-close" class="icon-btn" type="button" title="Chiudi">
            ✕
          </button>
        </div>
        <div class="settings-row">
          <label id="settings-lang-label" for="lang">Lingua</label>
          <select id="lang" class="field-select">
            <option value="it">Italiano</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="settings-row">
          <label id="settings-theme-label">Tema</label>
          <div class="theme-row" role="group" aria-label="Tema">
            <button data-theme-pref="system" class="theme-btn" title="Tema: sistema">
              🖥️
            </button>
            <button data-theme-pref="light" class="theme-btn" title="Tema: chiaro">
              ☀️
            </button>
            <button data-theme-pref="dark" class="theme-btn" title="Tema: scuro">
              🌙
            </button>
          </div>
        </div>
        <div class="settings-row">
          <label id="settings-history-label" for="settings-history-limit">
            Storico (messaggi)
          </label>
          <input
            id="settings-history-limit"
            class="field-number"
            type="number"
            min="5"
            max="1000"
            step="5"
          />
        </div>
        <div class="settings-row">
          <label id="settings-version-label">Versione</label>
          <span id="settings-version" class="settings-version">–</span>
        </div>
        <!-- pi.dev settings: block 2 (via /settings, from pi.dev) → placeholder;
             block 3 (launch CLI flags) → dynamic rows from the flags
             registered by pi+extensions + Apply button -->
        <div class="settings-section">
          <div class="settings-section-title" id="settings-pidev-title">pi.dev</div>
          <div class="settings-note" id="settings-pidev-note">…</div>
          <div id="cli-flags" class="settings-cli-flags"></div>
          <div class="settings-row" id="cli-apply-row" hidden>
            <button id="cli-apply" class="btn-primary" type="button">Applica</button>
            <span class="settings-hint" id="cli-apply-hint">…</span>
          </div>
        </div>
      </div>
    </div>

    <main id="messages" aria-live="polite">
      <div id="thread" class="thread"></div>
      <button
        id="scroll-bottom"
        class="scroll-bottom-btn"
        type="button"
        hidden
        title="Vai in fondo"
      ></button>
    </main>

    <!-- steering panel: visible only when there are queued messages -->
    <div id="steer-panel" class="steer-panel" hidden></div>

    <!-- editor selection block: one discreet row, appears only when there is
         an evident selection (like the steering, between thread and composer) -->
    <div id="selection-panel" class="selection-panel" hidden></div>

    <footer>
      <div id="connect-panel" class="connect-panel" hidden>
        <input id="connect-url" type="text" placeholder="ws://127.0.0.1:PORT?token=…" />
        <button id="btn-connect">Connetti</button>
      </div>
      <!-- context/slot badge: bar ADJACENT to the inputbox (above, no gap),
           same fluid width (max 56rem centered). Contains the context
           gauge (built-in) + the SLOTS filled by pi extensions via
           ctx.ui.setStatus (e.g. tokens-per-second). -->
      <div id="stats-badge" class="stats-badge" title="">
        <span class="stats-part stats-ctx">
          <svg class="ctx-gauge" viewBox="0 0 36 36" aria-hidden="true">
            <circle class="ctx-track" cx="18" cy="18" r="15.5"></circle>
            <circle id="ctx-fill" class="ctx-fill" cx="18" cy="18" r="15.5"></circle>
          </svg>
          <span id="ctx-label" class="ctx-label">–</span>
        </span>
        <span id="stats-slots" class="stats-slots"></span>
      </div>
      <div class="input-box">
        <!-- separate STOP: straddling the bottom-right corner of the
             input box, visible only while processing (plan 0004) -->
        <button
          id="stats-stop"
          class="stats-stop"
          type="button"
          title=""
          hidden
        ></button>
        <!-- slash command autocomplete dropdown (plan 0003): ONLY extension
             commands; opens upward above the input box -->
        <div id="cmd-dropdown" class="cmd-dropdown" hidden>
          <div id="cmd-list" class="cmd-list"></div>
          <div class="cmd-footer"><span id="cmd-counter"></span></div>
        </div>
        <div id="attachment-row" class="attachment-row"></div>
        <textarea
          id="input"
          rows="1"
          placeholder="Messaggio per pi — Invio per inviare, Shift+Invio per a capo"
        ></textarea>
        <div class="input-toolbar">
          <button id="trust" class="toolbar-chip trust-indicator" type="button" title="">
            <span id="trust-icon">🛡</span> <span id="trust-label"></span>
          </button>
          <span class="spacer"></span>
          <button id="btn-model" class="toolbar-chip" type="button" title="Modello">
            <span id="model-info"></span>
          </button>
          <span id="balance-chip" class="balance-chip" title="" hidden></span>
          <button id="btn-thinking" class="toolbar-chip" type="button" title="Pensiero">
            <span id="thinking-info"></span>
          </button>
          <!-- STOP + send close together (2px), a group that does not touch the others -->
          <span class="send-group">
            <button
              id="btn-stop"
              class="stop-btn"
              type="button"
              title=""
              hidden
            ></button>
            <button id="btn-send" class="send-btn" title="Invia">↑</button>
          </span>
        </div>
      </div>
    </footer>

    <!-- drag & drop overlay -->
    <div id="drop-overlay" class="drop-overlay" hidden>
      <div class="drop-overlay-content">
        <span id="drop-overlay-icon" class="drop-overlay-icon"></span>
        <span id="drop-overlay-text">Rilascia per allegare</span>
      </div>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
