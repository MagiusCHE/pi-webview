<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pi-webview</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/ansi.css" />
  </head>
  <body>
    <!-- boot loader: covers the UI until there is data -->
    <div id="boot-loader" class="boot-loader">
      <div class="boot-loader-stack">
        <div class="boot-loader-content">
          <span class="spinner"></span>
          <span id="boot-loader-text">Caricamento…</span>
        </div>
        <!-- extension logs while a session loads (slow extensions keep
             logging after the session file is ready): shown UNDER the
             spinner, the loader stays up until they go quiet -->
        <div id="boot-loader-logs" class="boot-loader-logs" hidden></div>
      </div>
    </div>

    <header>
      <div class="session-wrap">
        <span id="conn-dot" class="conn-dot conn-connecting" title="connessione…"></span>
        <div id="session-dropdown" class="dropdown">
          <button id="session-btn" class="session-btn" title="Sessioni">—</button>
          <div id="session-menu" class="dropdown-menu" hidden>
            <div id="session-filters" class="session-filters"></div>
            <div class="session-search-wrap">
              <input
                id="session-search"
                class="pop-search session-search"
                type="text"
                placeholder="Cerca sessione…"
                spellcheck="false"
              />
            </div>
            <div id="session-items" class="session-items"></div>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button
          id="btn-new-chat"
          class="icon-btn"
          title="Nuova chat in un altro pannello"
        ></button>
        <button
          id="btn-thinking-blocks"
          class="icon-btn"
          title="Espandi tutti i blocchi di pensiero"
          disabled
        ></button>
        <button
          id="btn-update-pi"
          class="icon-btn"
          title="Aggiorna pi e le estensioni"
        ></button>
        <button id="btn-reload" class="icon-btn" title="Ricarica"></button>
        <button
          id="btn-settings"
          class="icon-btn"
          title="Impostazioni"
          aria-expanded="false"
        >
          ⚙
        </button>
      </div>
      <div id="stats-topbar-row" class="stats-topbar-row"></div>
    </header>

    <!-- settings modal dialog -->
    <div id="settings-modal" class="modal-backdrop" hidden>
      <div class="modal settings-modal-dialog">
        <div class="modal-head">
          <span id="settings-modal-title" class="modal-title">Impostazioni</span>
          <button id="btn-settings-close" class="icon-btn" type="button" title="Chiudi">
            ✕
          </button>
        </div>
        <!-- 1. info (version etc.) -->
        <div class="settings-section">
          <div class="settings-section-title" id="settings-info-title">Info</div>
          <div class="settings-row">
            <label id="settings-version-label">Versione piw</label>
            <span id="settings-version" class="settings-version">–</span>
          </div>
        </div>
        <!-- 2. webview settings (typical webview options) -->
        <div class="settings-section">
          <div class="settings-section-title" id="settings-webview-title">Webview</div>
          <div class="settings-row">
            <label id="settings-lang-label" for="lang">Lingua</label>
            <select id="lang" class="field-select">
              <option value="it">Italiano</option>
              <option value="en">English</option>
            </select>
          </div>
          <div class="settings-row">
            <label id="settings-theme-label">Tema</label>
            <div class="theme-row" role="group" aria-label="Tema">
              <button data-theme-pref="system" class="theme-btn" title="Tema: sistema">
                🖥️
              </button>
              <button data-theme-pref="light" class="theme-btn" title="Tema: chiaro">
                ☀️
              </button>
              <button data-theme-pref="dark" class="theme-btn" title="Tema: scuro">
                🌙
              </button>
            </div>
          </div>
          <div class="settings-row">
            <label id="settings-history-label" for="settings-history-limit">
              Storico (messaggi)
            </label>
            <input
              id="settings-history-limit"
              class="field-number"
              type="number"
              min="5"
              max="1000"
              step="5"
            />
          </div>
          <div class="settings-row">
            <label id="settings-agentic-thinking-label" for="agentic-thinking">
              Agentic thinking
            </label>
            <input id="agentic-thinking" class="field-checkbox" type="checkbox" />
          </div>
          <div class="settings-note" id="settings-agentic-thinking-note"></div>
          <div class="settings-row">
            <label id="settings-allow-remote-npm-label" for="settings-allow-remote-npm">
              Consenti dipendenze npm remote negli aggiornamenti
            </label>
            <input
              id="settings-allow-remote-npm"
              class="field-checkbox"
              type="checkbox"
            />
          </div>
          <div class="settings-note" id="settings-allow-remote-npm-note"></div>
          <div class="settings-row">
            <label id="settings-allow-npm-scripts-label" for="settings-allow-npm-scripts">
              Consenti tutti gli script di installazione npm negli aggiornamenti
            </label>
            <input
              id="settings-allow-npm-scripts"
              class="field-checkbox"
              type="checkbox"
            />
          </div>
          <div class="settings-note" id="settings-allow-npm-scripts-note"></div>
          <div class="settings-row">
            <label id="settings-stats-bar-label" for="stats-bar-pos"
              >Posizione barra stato</label
            >
            <select
              id="stats-bar-pos"
              class="field-select"
              title="Stats bar position"
            ></select>
          </div>
          <div class="settings-row">
            <label id="settings-stats-bar-compact-label" for="stats-bar-compact"
              >Barra stato compatta</label
            >
            <input id="stats-bar-compact" class="field-checkbox" type="checkbox" />
          </div>
          <div class="settings-subsection">
            <div class="settings-subsection-title" id="settings-hidden-status-title">
              Elementi barra stato
            </div>
            <div class="settings-note" id="settings-hidden-status-note"></div>
            <div id="settings-hidden-status-list" class="hidden-status-list"></div>
          </div>
          <!-- sub-group: notifications (default + per-session override) -->
          <div class="settings-subsection">
            <div class="settings-subsection-title" id="settings-notifications-title">
              Notifiche
            </div>
            <div class="settings-row">
              <label id="settings-notifications-label" for="notifications"
                >Nuove sessioni</label
              >
              <select
                id="notifications"
                class="field-select"
                title="Notifications"
              ></select>
            </div>
            <div class="settings-row">
              <label id="settings-notifications-session-label" for="notifications-session"
                >Questa sessione</label
              >
              <select
                id="notifications-session"
                class="field-select"
                title="Notifications (this session)"
              ></select>
            </div>
          </div>
        </div>
        <div id="settings-speech-section" class="settings-section">
          <div class="settings-section-title" id="settings-speech-title"></div>
          <div
            id="settings-speech-status"
            class="settings-note settings-speech-status"
            role="status"
          >
            <span
              id="settings-speech-status-icon"
              class="settings-speech-status-icon"
              aria-hidden="true"
            ></span>
            <span id="settings-speech-status-text"></span>
          </div>
          <div id="settings-speech-controls" hidden>
            <div class="settings-row settings-speech-cloud-row">
              <label id="settings-speech-cloud-label" for="settings-speech-cloud"></label>
              <input id="settings-speech-cloud" class="field-checkbox" type="checkbox" />
            </div>
            <div id="settings-speech-cloud-note" class="settings-note"></div>
            <div class="settings-row settings-speech-operational">
              <label
                id="settings-speech-device-label"
                for="settings-speech-device"
              ></label>
              <div class="settings-inline-control">
                <select id="settings-speech-device" class="field-select"></select>
                <button
                  id="settings-speech-refresh-devices"
                  class="btn"
                  type="button"
                ></button>
              </div>
            </div>
            <div
              id="settings-speech-device-note"
              class="settings-note settings-speech-operational"
            ></div>
            <div class="settings-row settings-speech-operational">
              <label id="settings-speech-mode-label" for="settings-speech-mode"></label>
              <select id="settings-speech-mode" class="field-select"></select>
            </div>
            <div class="settings-row settings-speech-operational">
              <label
                id="settings-speech-push-shortcut-label"
                for="settings-speech-push-shortcut"
              ></label>
              <div class="settings-inline-control">
                <output
                  id="settings-speech-push-shortcut"
                  class="speech-shortcut-value"
                ></output>
                <button
                  id="settings-speech-push-shortcut-capture"
                  class="btn"
                  type="button"
                ></button>
              </div>
            </div>
            <div class="settings-row settings-speech-operational">
              <label
                id="settings-speech-toggle-shortcut-label"
                for="settings-speech-toggle-shortcut"
              ></label>
              <div class="settings-inline-control">
                <output
                  id="settings-speech-toggle-shortcut"
                  class="speech-shortcut-value"
                ></output>
                <button
                  id="settings-speech-toggle-shortcut-capture"
                  class="btn"
                  type="button"
                ></button>
              </div>
            </div>
            <div
              id="settings-speech-shortcut-note"
              class="settings-note settings-speech-operational"
            ></div>
            <div class="settings-row settings-speech-local-setup">
              <label
                id="settings-speech-language-label"
                for="settings-speech-language"
              ></label>
              <select id="settings-speech-language" class="field-select"></select>
            </div>
            <div
              class="settings-row settings-speech-model-actions settings-speech-local-setup"
            >
              <span
                id="settings-speech-model-status"
                class="settings-hint"
                role="status"
              ></span>
              <span class="settings-inline-control">
                <button
                  id="settings-speech-install-model"
                  class="btn"
                  type="button"
                ></button>
                <button
                  id="settings-speech-remove-model"
                  class="btn"
                  type="button"
                  disabled
                ></button>
              </span>
            </div>
            <div
              id="settings-speech-model-note"
              class="settings-note settings-speech-local-setup"
            ></div>
            <div class="settings-row settings-speech-operational">
              <label id="settings-speech-pause-label" for="settings-speech-pause"></label>
              <input
                id="settings-speech-pause"
                class="field-number"
                type="number"
                min="500"
                max="10000"
                step="100"
              />
            </div>
          </div>
        </div>
        <div id="settings-browser-section" class="settings-section" hidden>
          <div class="settings-section-title" id="settings-browser-title">
            Connessione browser
          </div>
          <label id="settings-browser-url-label" for="settings-browser-url"
            >URL completo del server piw</label
          >
          <input
            id="settings-browser-url"
            class="field-text settings-browser-url"
            type="url"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="settings-note" id="settings-browser-url-note"></div>
          <div class="settings-row settings-browser-status-row">
            <span id="settings-browser-status" class="settings-hint" role="status"></span>
          </div>
          <div class="settings-row settings-browser-permissions">
            <button id="settings-browser-reset-permissions" class="btn" type="button">
              Resetta autorizzazioni per tutti i siti
            </button>
            <span
              id="settings-browser-permissions-status"
              class="settings-hint"
              role="status"
            ></span>
          </div>
        </div>
        <!-- 3. pi.dev settings (via /settings, from pi.dev) → dynamic facade -->
        <div class="settings-section">
          <div class="settings-section-title" id="settings-pidev-title">pi.dev</div>
          <div class="settings-note" id="settings-pidev-note">…</div>
          <div id="settings-pidev-body" class="settings-pidev-body"></div>
        </div>
        <!-- 4. command-line switches (launch flags for this session) -->
        <div class="settings-section">
          <div class="settings-section-title" id="settings-cli-title">
            Switch da riga di comando
          </div>
          <div id="cli-flags" class="settings-cli-flags"></div>
        </div>
        <div class="settings-apply-footer" id="settings-apply-row" hidden>
          <button id="settings-apply" class="btn-primary" type="button">Applica</button>
          <span class="settings-hint" id="settings-apply-hint">…</span>
        </div>
      </div>
    </div>

    <!-- update dialog: what will be updated (pi core and/or npm extensions) -->
    <div id="update-modal" class="modal-backdrop" hidden>
      <div class="modal update-modal-dialog">
        <div class="modal-head">
          <span id="update-modal-title" class="modal-title">Aggiornamenti</span>
          <button id="btn-update-close" class="icon-btn" type="button" title="Chiudi">
            ✕
          </button>
        </div>
        <p id="update-modal-desc" class="update-modal-desc"></p>
        <div id="update-list" class="update-list"></div>
        <div class="update-modal-actions">
          <button id="btn-update-cancel" class="btn" type="button">Annulla</button>
          <button id="btn-update-confirm" class="btn-primary" type="button">
            Conferma
          </button>
        </div>
      </div>
    </div>

    <main id="messages" aria-live="polite">
      <div id="thread" class="thread"></div>
      <button
        id="scroll-bottom"
        class="scroll-bottom-btn"
        type="button"
        hidden
        title="Vai in fondo"
      ></button>
    </main>

    <!-- steering panel: visible only when there are queued messages -->
    <div id="steer-panel" class="steer-panel" hidden></div>

    <!-- editor selection block: one discreet row, appears only when there is
         an evident selection (like the steering, between thread and composer) -->
    <div id="selection-panel" class="selection-panel" hidden></div>

    <footer>
      <div id="connect-panel" class="connect-panel" hidden>
        <strong id="connect-title" class="connect-title">Connessione piw</strong>
        <span id="connect-error" class="connect-error" role="alert"></span>
        <input
          id="connect-url"
          type="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="http://127.0.0.1:7361"
        />
        <button id="btn-connect">Connetti</button>
      </div>
      <!-- context/slot badge: bar ADJACENT to the inputbox (above, no gap),
           same fluid width (max 56rem centered). Contains the context
           gauge (built-in) + the SLOTS filled by pi extensions via
           ctx.ui.setStatus (e.g. tokens-per-second). -->
      <div id="stats-badge" class="stats-badge" title="">
        <span class="stats-part stats-ctx">
          <svg class="ctx-gauge" viewBox="0 0 36 36" aria-hidden="true">
            <circle class="ctx-track" cx="18" cy="18" r="15.5"></circle>
            <circle id="ctx-fill" class="ctx-fill" cx="18" cy="18" r="15.5"></circle>
          </svg>
          <span id="ctx-label" class="ctx-label">–</span>
        </span>
        <span id="stats-slots" class="stats-slots"></span>
      </div>
      <div class="input-box">
        <!-- separate STOP: straddling the bottom-right corner of the
             input box, visible only while processing (plan 0004) -->
        <button id="stats-stop" class="stats-stop" type="button" title="" hidden></button>
        <!-- slash command autocomplete dropdown (plan 0003): ONLY extension
             commands; opens upward above the input box -->
        <div id="cmd-dropdown" class="cmd-dropdown" hidden>
          <div id="cmd-list" class="cmd-list"></div>
          <div class="cmd-footer"><span id="cmd-counter"></span></div>
        </div>
        <div id="attachment-row" class="attachment-row"></div>
        <textarea
          id="input"
          rows="1"
          placeholder="Messaggio per pi — Invio per inviare, Shift+Invio per a capo"
        ></textarea>
        <div class="input-toolbar">
          <button id="trust" class="toolbar-chip trust-indicator" type="button" title="">
            <span id="trust-icon">🛡</span
            ><span id="trust-badge" class="trust-badge" hidden>!</span>
            <span id="trust-label"></span>
          </button>
          <span class="toolbar-spacer"></span>
          <button id="btn-model" class="toolbar-chip" type="button" title="Modello">
            <span id="model-info"></span>
          </button>
          <span id="balance-chip" class="balance-chip" title="" hidden></span>
          <button id="btn-thinking" class="toolbar-chip" type="button" title="Pensiero">
            <span id="thinking-info"></span>
          </button>
          <!-- STOP + send close together (2px), a group that does not touch the others -->
          <button
            id="btn-attach"
            class="toolbar-chip attach-btn"
            type="button"
            title=""
          ></button>
          <input id="browser-file-picker" type="file" multiple hidden />
          <span class="send-group">
            <button id="btn-stop" class="stop-btn" type="button" title="" hidden></button>
            <button
              id="btn-speech"
              class="speech-btn"
              type="button"
              title=""
              aria-pressed="false"
              hidden
            ></button>
            <button id="btn-send" class="send-btn" title="Invia">↑</button>
          </span>
        </div>
      </div>
    </footer>

    <!-- drag & drop overlay -->
    <div id="drop-overlay" class="drop-overlay" hidden>
      <div class="drop-overlay-content">
        <span id="drop-overlay-icon" class="drop-overlay-icon"></span>
        <span id="drop-overlay-text">Rilascia per allegare</span>
      </div>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
